# The registry of named chats that have a mailbox (H-077; docs/method/communication.md). One table per agent;
# adding an agent is one table here and `python3 scripts/method/mail.py register <name>`. Read by mail.py, station.py
# (every loop) and status_check.py. Keys: role (the card), rules (may receive `ask`), wake (classes that raise the flag
# at once, default block/ask/westley), linger_min and batch (override DRAFT-mail-linger and DRAFT-mail-batch),
# senders ("*" or a list of agent names allowed to write here, default "*").

[architect]
role = "architect.md"
rules = true
wake = ["block", "ask", "westley"]
senders = ["*"]

[runner-lab]
role = "runner.md"
rules = false

[runner-beta]
role = "runner.md"
rules = false

[westley]
role = "westley.md"
rules = false
senders = []

[gate-queue]
role = "none"
rules = false
senders = []
