# What a chat re-reads, fully, after a compaction before it acts (H-062; checked by scripts/specfactory/method_check.py).
# Whoever starts or ends a plan edits this file in the same commit as the ROADMAP row.

[architect]
files = [
  "docs/northstar/ROADMAP.md",
  "docs/northstar/plans/2026-11-02-beta-staircase.md",
  "docs/northstar/plans/2026-10-31-lab-staircase.md",
  "docs/northstar/story_reviews/westley/decisions.md",
  "docs/method/architect.md",
  "docs/method/communication.md",
]

[runner_lab]
files = [
  "docs/method/runner.md",
  "docs/method/communication.md",
  "docs/northstar/ROADMAP.md",
  "docs/northstar/plans/2026-10-31-lab-staircase.md",
]

[runner_beta]
# A runner whose session name contains any string in `match` is held to this list, else to runner_lab.
match = ["beta", "7f"]
files = [
  "docs/method/runner.md",
  "docs/method/communication.md",
  "docs/northstar/ROADMAP.md",
  "docs/northstar/plans/2026-11-02-beta-staircase.md",
  "docs/northstar/plans/2026-11-02-beta-dispatcher-context.md",
]
