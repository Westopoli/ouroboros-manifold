# docs/northstar/plans/push/pieces.toml -- F6 item 4 (two-day push).
# One [[piece]] per plan piece from docs/northstar/plans/briefs/2026-09-22-two-day-push.md's
# wave-0/wave-1/wave-2/wave-3 tables. `owns` is exact paths (footprint fence: the piece's
# diff must equal this set exactly); `owns_glob` allows glob patterns for a piece whose
# footprint is a whole new directory. `acceptance` is pytest node ids (collected by
# `pieces.py --check`) or a Godot test script path (existence-checked only, since
# run_godot_tests.sh does not use pytest collection). `tests_pending = true` marks a piece
# whose acceptance file(s) are not written yet (a future M0 action named in the plan) --
# `pieces.py --check` WARNs instead of FAILing on those so this file can be authored ahead
# of the tests it names. `depends_on` uses piece ids, or the literal "freeze" for wave-0's
# F0..F6 (not modeled as pieces here -- they are M0's own direct-to-main work, never merged
# through merge_cli.py).

