# Symbol-to-module ownership for symbols that more than one epic's tests call.
# Claude-owned data (design lane), drafted 2026-09-21 night from
# docs/northstar/proving_ground/evidence/card_regen/cross_epic.md, for Westley's
# review before card_regen.py and skeleton_gen.py read it. Rule: a symbol is owned
# by the module whose epic defines its behaviour in the bible; every other epic's
# card drops it and treats it as a prerequisite (sequential ownership across
# epics, the same rule card_regen applies within one epic). A module's owning
# epic is the one whose cards build it; "core" symbols live in sim.c and are
# built by a core card, not by any feature epic.

[modules]
"sim.c"             = "core"
"events.c"          = "E-04"
"friction.c"        = "E-05"
"worldgen.c"        = "E-03"
"diplomacy.c"       = "E-06"
"lifecycle.c"       = "E-07"
"generational.c"    = "E-08"
"chronicle.c"       = "E-09"
"mission.c"         = "E-10"
"unit.c"            = "E-11"
"fog.c"             = "E-12"
"tactical_move.c"   = "E-13"
"enemy_macro.c"     = "E-14"
"tactical_support.c"= "E-15"
"tactical_mapgen.c" = "E-17"
"save.c"            = "E-16"

[symbols]
