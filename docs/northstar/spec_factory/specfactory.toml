# scripts/specfactory/tick_closure.py reads [chain_graph] orchestrators from
# here (falls back to {"om_world_step"} if this file or the table is absent).
# The set for tick-stage closure (decision 3, docs/northstar/plans/briefs/
# 2026-09-22-two-day-push.md): om_world_step calls om_tactical_step once a
# tactical map is loaded (freeze/F2); the other five are E-11's own tactical
# tick orchestrators (symbol_modules.toml).

[chain_graph]
orchestrators = [
    "om_world_step",
    "om_tactical_step",
    "om_tactical_tick",
    "om_tactical_tick_to",
    "om_tactical_run",
    "om_tactical_run_until_eliminated",
    "om_tactical_run_until_engagement_ends",
]
