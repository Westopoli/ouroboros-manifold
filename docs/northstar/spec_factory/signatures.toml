params = [{ name = "w", ctype = "const om_world*" }, { name = "k", ctype = "uint32_t" }, { name = "owners_out", ctype = "int32_t*" }, { name = "cap", ctype = "uint32_t" }]
epics = ["E-09"]
confidence = "likely"
note = "G-C3 (A48 item 13): owner per region (-1 unowned) at tick start_tick + STRIDE*k of the last jump; returns n_regions, 0 when k out of range or cap < n_regions. Header doc (moved here from ouroboros_sim.h): G-C3 (A48 item 13): the ownership timeline of the last completed om_time_jump_run, one snapshot every OM_OWNERSHIP_TIMELINE_STRIDE ticks. Snapshot k is the owner of each region (faction id, -1 unowned) at tick report.start_tick + STRIDE*k, so k = 0 is the state before the jump's first tick. Snapshots are every STRIDE ticks from the start, so an odd jump length has no snapshot at end_tick (A59). Memory only, never saved. Copies n_regions int32 values into owners_out and returns n_regions; returns 0, writing nothing, when k is not below om_time_jump_ownership_snapshot_count or cap < n_regions."

