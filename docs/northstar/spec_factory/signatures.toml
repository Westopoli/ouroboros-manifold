epics = ["E-17"]
confidence = "likely"
internal = true
note = "K-e5 test hook (hard-fixture path; listed in scripts/specfactory/reach_allowlist.toml): replaces the height grid of a generated ground mission with cm values (row-major, cells_w * cells_h). 0 and nothing changed when the dimensions differ from the terrain's or there is no terrain. Otherwise recomputes the five band floors as generation does (no cell above the dry level: lo and hi are the minimum and maximum of all cells), bands the cells with ts_bands_from_floors, runs om_terrain_apply_ground (walkable, slopes, walk masks and mapgen blocked bits rewritten; obstacle discs and cover rows survive; move epoch bumped), then om_density_rebuild_inputs; returns 1. Flat test terrains use heights above 6000 cm (the dry test is strict)."

# ---- VG K-d: space field (lane D contract piece, 2026-10-07 spec rev 4; S-246 R-246-01..03, E-01 R-001-04) ----
# Canvas 24000 wu only (240 x 240 cells of 100 wu, 5 layers). Mask byte: 1 blocked, 0 open (the blocked_bits sense).

[[symbols]]
name = "om_space_field_generate_nodes"
module = "space_field.c"
restype = "int"
params = [{ name = "w", ctype = "om_world*" }, { name = "seed", ctype = "uint32_t" }, { name = "canvas_w", ctype = "double" }, { name = "canvas_h", ctype = "double" }, { name = "density", ctype = "double" }, { name = "node_xy", ctype = "const double*" }, { name = "node_slots", ctype = "const uint32_t*" }, { name = "n_nodes", ctype = "uint32_t" }]
epics = ["E-17"]
confidence = "likely"
note = "Generates the five-layer open-or-blocked field from the seed, replacing any held one; writes the masks to the route grid (blocked_bits) when the mapgen canvas is 24000 x 24000 wu. 0 ok, nonzero refused (null world, canvas not 24000 x 24000). density 0..90 (clamped), the plate keep share in percent; the pipe passes 35.0 (field_map_space.gd default).  VG-D8 R-246-07: the clearing nodes. node_xy is n_nodes x,y pairs (faction 0 anchor, faction 1 anchor, objective, then any extra, n_nodes capped at OM_SPACE_FIELD_MAX_NODES 8); node_slots[i] is the army slot count the pocket at node i must hold (0 for the objective): the pocket grows ring by ring until its open cells hold it. n_nodes below 3 or null node_xy takes the old 15/85 percent diagonal nodes. (The 5-argument wrapper om_space_field_generate was removed, TD-VG-D-10: it was reachable only from tests.)"

