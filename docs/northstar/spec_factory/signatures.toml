# signatures.toml: the one source for header declarations, ctypes bindings and skeletons (F1, 2026-09-22).
# Resolution rules applied by the design lane (D-F1): positional-only parameter names are cosmetic (renamed from the transcriber notes where given);
# a doubtful status return is int; command functions take a group (ids array, count) and the conftest wrapper adapts single-unit calls;
# om_unit_get_pos writes out-params and the wrapper returns (x, y); om_time_jump_run takes an optional report pointer; tactical orchestrators return uint64_t.
# `wrapper` names the conftest adapter sig_table.py must generate for that symbol.

[meta]
abi_version = 7
symbol_count = 767
struct_count = 45
ambiguous_remaining = 0

