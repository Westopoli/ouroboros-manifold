<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" version="1.1">
  <rect x="0" y="0" width="960" height="600" fill="#f4f1ea"/>
  <text x="480" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b2621">Option B — Full Muster</text>
  <text x="480" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#55493c">Pre-briefing screen, same mission seed, two difficulties</text>

  <!-- Easy panel -->
  <rect x="40" y="90" width="410" height="430" fill="#ffffff" stroke="#8a7a63" stroke-width="2"/>
  <text x="245" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2b2621">Difficulty: Easy</text>
  <line x1="60" y1="132" x2="430" y2="132" stroke="#c9bfa9" stroke-width="1"/>

  <text x="60" y="158" font-family="Georgia, serif" font-size="14" fill="#2b2621">Your force (baseline, fixed)</text>
  <g font-family="Georgia, serif" font-size="12" fill="#2b2621">
    <rect x="60" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="94" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="128" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="162" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="196" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="230" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <text x="60" y="216" font-size="12">6 squads, 2 heavies — same at any difficulty</text>
  </g>

  <text x="60" y="252" font-family="Georgia, serif" font-size="14" fill="#2b2621">Enemy dispositions (scouted)</text>
  <rect x="60" y="262" width="150" height="52" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="135" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">2 armor groups</text>
  <text x="135" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">1 garrison</text>

  <line x1="60" y1="336" x2="430" y2="336" stroke="#c9bfa9" stroke-width="1"/>
  <text x="60" y="358" font-family="Georgia, serif" font-size="13" fill="#2b2621">Briefing: "a light garrison holds the line"</text>
  <text x="60" y="380" font-family="Georgia, serif" font-size="12" fill="#55493c">Enemy headcount at its floor for this mission</text>
  <text x="60" y="408" font-family="Georgia, serif" font-size="12" fill="#7a6d5a" font-style="italic">Same unit stats, same plan, same decision loop</text>

  <!-- Hard panel -->
  <rect x="510" y="90" width="410" height="430" fill="#ffffff" stroke="#8a7a63" stroke-width="2"/>
  <text x="715" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2b2621">Difficulty: Hard</text>
  <line x1="530" y1="132" x2="900" y2="132" stroke="#c9bfa9" stroke-width="1"/>

  <text x="530" y="158" font-family="Georgia, serif" font-size="14" fill="#2b2621">Your force (baseline, fixed)</text>
  <g font-family="Georgia, serif" font-size="12" fill="#2b2621">
    <rect x="530" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="564" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="598" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="632" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="666" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="700" y="168" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <text x="530" y="216" font-size="12">6 squads, 2 heavies — identical to Easy panel</text>
  </g>

  <text x="530" y="252" font-family="Georgia, serif" font-size="14" fill="#2b2621">Enemy dispositions (scouted)</text>
  <rect x="530" y="262" width="150" height="52" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="605" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">3 armor groups</text>
  <text x="605" y="294" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">2 garrisons</text>
  <rect x="690" y="262" width="130" height="52" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="755" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">+1 patrol</text>
  <text x="755" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">(new, scoutable)</text>

  <line x1="530" y1="336" x2="900" y2="336" stroke="#c9bfa9" stroke-width="1"/>
  <text x="530" y="358" font-family="Georgia, serif" font-size="13" fill="#2b2621">Briefing: "a full muster holds the line"</text>
  <text x="530" y="380" font-family="Georgia, serif" font-size="12" fill="#55493c">Enemy headcount at its ceiling for this mission</text>
  <text x="530" y="408" font-family="Georgia, serif" font-size="12" fill="#7a6d5a" font-style="italic">Same unit stats, same plan, same decision loop</text>

  <text x="480" y="546" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2b2621">Knob location: onboarding (S-063), changeable later — moves only the "enemy" row above</text>
  <text x="480" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#55493c">Your own force row never changes with difficulty</text>
</svg>
