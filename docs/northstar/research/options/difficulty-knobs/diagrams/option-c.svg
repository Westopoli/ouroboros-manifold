<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" version="1.1">
  <rect x="0" y="0" width="960" height="560" fill="#f4f1ea"/>
  <text x="480" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b2621">Option C — The Long Supply Line (wild)</text>
  <text x="480" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#55493c">Enemy replacements received over one mission, same starting forces at minute zero</text>

  <!-- Axes -->
  <line x1="90" y1="470" x2="900" y2="470" stroke="#2b2621" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="470" stroke="#2b2621" stroke-width="2"/>
  <text x="480" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2b2621">Mission time (minutes)</text>
  <text x="40" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2b2621" transform="rotate(-90 40 280)">Enemy units resupplied</text>

  <!-- x ticks 0,2,4,6,8,10 -->
  <g font-family="Georgia, serif" font-size="12" fill="#2b2621">
    <line x1="90" y1="470" x2="90" y2="478" stroke="#2b2621"/>
    <text x="90" y="494" text-anchor="middle">0</text>
    <line x1="230" y1="470" x2="230" y2="478" stroke="#2b2621"/>
    <text x="230" y="494" text-anchor="middle">2</text>
    <line x1="370" y1="470" x2="370" y2="478" stroke="#2b2621"/>
    <text x="370" y="494" text-anchor="middle">4</text>
    <line x1="510" y1="470" x2="510" y2="478" stroke="#2b2621"/>
    <text x="510" y="494" text-anchor="middle">6</text>
    <line x1="650" y1="470" x2="650" y2="478" stroke="#2b2621"/>
    <text x="650" y="494" text-anchor="middle">8</text>
    <line x1="790" y1="470" x2="790" y2="478" stroke="#2b2621"/>
    <text x="790" y="494" text-anchor="middle">10</text>
  </g>

  <!-- both-side baseline dot at tick 0 -->
  <circle cx="90" cy="440" r="6" fill="#2b2621"/>
  <text x="90" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2b2621">Identical starting forces</text>

  <!-- Easy step line: slow trickle -->
  <polyline points="90,440 230,430 230,430 370,415 370,415 510,398 510,398 650,382 650,382 790,368"
            fill="none" stroke="#5c7a4a" stroke-width="3"/>
  <text x="800" y="368" font-family="Georgia, serif" font-size="12" fill="#3f5533">Easy — slow trickle</text>

  <!-- Hard step line: fast trickle, then flattens after capture at minute 6 -->
  <polyline points="90,440 230,410 230,410 370,368 370,368 510,320"
            fill="none" stroke="#a15a3a" stroke-width="3"/>
  <polyline points="510,320 650,312 650,312 790,304"
            fill="none" stroke="#a15a3a" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="800" y="304" font-family="Georgia, serif" font-size="12" fill="#7a3f26">Hard — fast trickle</text>

  <!-- capture event marker -->
  <circle cx="510" cy="320" r="7" fill="#2b2621"/>
  <line x1="510" y1="320" x2="510" y2="140" stroke="#2b2621" stroke-width="1" stroke-dasharray="3,4"/>
  <rect x="420" y="96" width="220" height="46" fill="#ffffff" stroke="#8a7a63"/>
  <text x="530" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">Minute 6: player captures</text>
  <text x="530" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">the enemy's reinforcement point</text>

  <!-- legend for dashed = slowed after capture -->
  <text x="650" y="340" font-family="Georgia, serif" font-size="11" fill="#7a6d5a" font-style="italic">trickle rate falls toward Easy's after capture</text>

  <rect x="60" y="512" width="18" height="4" fill="#5c7a4a"/>
  <text x="86" y="518" font-family="Georgia, serif" font-size="12" fill="#2b2621">Easy: reinforcement structures resupply the enemy slowly</text>
  <rect x="530" y="512" width="18" height="4" fill="#a15a3a"/>
  <text x="556" y="518" font-family="Georgia, serif" font-size="12" fill="#2b2621">Hard: faster, until the player denies the structure</text>
</svg>
