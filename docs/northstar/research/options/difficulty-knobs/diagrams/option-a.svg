<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" version="1.1">
  <rect x="0" y="0" width="960" height="600" fill="#f4f1ea"/>
  <text x="480" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2b2621">Option A — Civilization's Ledger</text>
  <text x="480" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#55493c">Pre-briefing screen, same mission seed, two difficulties</text>

  <!-- Easy panel -->
  <rect x="40" y="90" width="410" height="430" fill="#ffffff" stroke="#8a7a63" stroke-width="2"/>
  <text x="245" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2b2621">Difficulty: Easy</text>
  <line x1="60" y1="132" x2="430" y2="132" stroke="#c9bfa9" stroke-width="1"/>

  <text x="60" y="158" font-family="Georgia, serif" font-size="14" fill="#2b2621">Enemy dispositions (scouted)</text>
  <rect x="60" y="168" width="150" height="60" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="135" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">3 armor groups</text>
  <text x="135" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">1 artillery nest</text>
  <rect x="220" y="168" width="120" height="60" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="280" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">1 garrison</text>

  <text x="60" y="252" font-family="Georgia, serif" font-size="14" fill="#2b2621">Your force (this difficulty)</text>
  <g font-family="Georgia, serif" font-size="12" fill="#2b2621">
    <rect x="60" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="94" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="128" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="162" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="196" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="230" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="264" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="298" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <rect x="332" y="262" width="28" height="28" fill="#9fb08a" stroke="#4c5c3d"/>
    <text x="60" y="312" font-size="12">9 squads</text>
    <rect x="60" y="322" width="40" height="28" fill="#7c8f66" stroke="#4c5c3d"/>
    <rect x="108" y="322" width="40" height="28" fill="#7c8f66" stroke="#4c5c3d"/>
    <rect x="156" y="322" width="40" height="28" fill="#7c8f66" stroke="#4c5c3d"/>
    <text x="60" y="368" font-size="12">3 heavies</text>
  </g>

  <line x1="60" y1="390" x2="430" y2="390" stroke="#c9bfa9" stroke-width="1"/>
  <text x="60" y="412" font-family="Georgia, serif" font-size="13" fill="#2b2621">Briefing: "your civilization spared a full muster"</text>
  <text x="60" y="432" font-family="Georgia, serif" font-size="12" fill="#55493c">Parity near enemy's total strength (R-074-03)</text>

  <!-- Hard panel -->
  <rect x="510" y="90" width="410" height="430" fill="#ffffff" stroke="#8a7a63" stroke-width="2"/>
  <text x="715" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2b2621">Difficulty: Hard</text>
  <line x1="530" y1="132" x2="900" y2="132" stroke="#c9bfa9" stroke-width="1"/>

  <text x="530" y="158" font-family="Georgia, serif" font-size="14" fill="#2b2621">Enemy dispositions (scouted)</text>
  <rect x="530" y="168" width="150" height="60" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="605" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">3 armor groups</text>
  <text x="605" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">1 artillery nest</text>
  <rect x="690" y="168" width="120" height="60" fill="#e7ded0" stroke="#8a7a63"/>
  <text x="750" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2b2621">1 garrison</text>
  <text x="530" y="246" font-family="Georgia, serif" font-size="11" fill="#7a6d5a" font-style="italic">identical to Easy panel — same count, same route</text>

  <text x="530" y="266" font-family="Georgia, serif" font-size="14" fill="#2b2621">Your force (this difficulty)</text>
  <g font-family="Georgia, serif" font-size="12" fill="#2b2621">
    <rect x="530" y="276" width="28" height="28" fill="#b08a6a" stroke="#5c4530"/>
    <rect x="564" y="276" width="28" height="28" fill="#b08a6a" stroke="#5c4530"/>
    <rect x="598" y="276" width="28" height="28" fill="#b08a6a" stroke="#5c4530"/>
    <rect x="632" y="276" width="28" height="28" fill="#b08a6a" stroke="#5c4530"/>
    <rect x="666" y="276" width="28" height="28" fill="#b08a6a" stroke="#5c4530"/>
    <rect x="700" y="276" width="28" height="28" fill="#b08a6a" stroke="#5c4530"/>
    <text x="530" y="326" font-size="12">6 squads</text>
    <rect x="530" y="336" width="40" height="28" fill="#93704f" stroke="#5c4530"/>
    <rect x="578" y="336" width="40" height="28" fill="#93704f" stroke="#5c4530"/>
    <text x="530" y="382" font-size="12">2 heavies</text>
  </g>

  <line x1="530" y1="390" x2="900" y2="390" stroke="#c9bfa9" stroke-width="1"/>
  <text x="530" y="412" font-family="Georgia, serif" font-size="13" fill="#2b2621">Briefing: "the civilization could spare little"</text>
  <text x="530" y="432" font-family="Georgia, serif" font-size="12" fill="#55493c">Parity near mission floor (R-074-03)</text>

  <text x="480" y="546" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2b2621">Knob location: onboarding (S-063), changeable later — moves only the "your force" row above</text>
  <text x="480" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#55493c">Enemy row never changes with difficulty</text>
</svg>
