<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="#f6f4ee"/>
  <text x="480" y="30" font-family="Georgia, serif" font-size="20" fill="#1a1a1a" text-anchor="middle">Option D — The Long Look (wild)</text>
  <text x="480" y="50" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">Same study minute, two eras: identical terrain, a different way of being shown it.</text>

  <!-- Left panel: manual study era -->
  <rect x="30" y="70" width="430" height="330" fill="#efe9dc" stroke="#333333" stroke-width="2"/>
  <text x="245" y="95" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Older era — plain rendering, you pan and look</text>

  <path d="M60,250 L120,210 L180,240 L240,190 L300,230 L360,200 L420,240" stroke="#8a6d3b" stroke-width="2" fill="none"/>
  <text x="245" y="270" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle">ridge line — no callouts</text>

  <circle cx="240" cy="190" r="6" fill="none" stroke="#4a2f6b" stroke-width="1.5"/>
  <text x="240" y="175" font-family="sans-serif" font-size="9" fill="#4a2f6b" text-anchor="middle">vantage point</text>
  <text x="240" y="315" font-family="sans-serif" font-size="9" fill="#888888" text-anchor="middle">(not marked — found on your second pass)</text>

  <rect x="60" y="340" width="370" height="45" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="245" y="360" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">No search, no highlights — every scrap of terrain still shown, complete</text>
  <text x="245" y="376" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">clock not running · no enemy shown · no unit moves</text>

  <!-- Right panel: instant study era -->
  <rect x="500" y="70" width="430" height="330" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="715" y="95" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Newer era — searchable overlay, instant answers</text>

  <rect x="530" y="115" width="370" height="26" rx="4" fill="#eef3fb" stroke="#33455c" stroke-width="1"/>
  <text x="545" y="132" font-family="sans-serif" font-size="10" fill="#33455c">Ask: "show elevated positions"</text>

  <path d="M530,250 L590,210 L650,240 L710,190 L770,230 L830,200 L890,240" stroke="#33455c" stroke-width="2" fill="none"/>
  <circle cx="710" cy="190" r="8" fill="#eef3fb" stroke="#c0392b" stroke-width="2"/>
  <text x="710" y="172" font-family="sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">vantage point — circled</text>

  <rect x="530" y="340" width="370" height="45" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="715" y="360" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Same terrain, answered for you at a glance</text>
  <text x="715" y="376" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">clock not running · no enemy shown · no unit moves</text>

  <text x="480" y="425" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">The recon screen is built once, the same complete way, for every era — only how it is presented and queried differs.</text>
</svg>
