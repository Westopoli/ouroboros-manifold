<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="#f6f4ee"/>
  <text x="480" y="30" font-family="Georgia, serif" font-size="20" fill="#1a1a1a" text-anchor="middle">Option B — The Climate of War</text>
  <text x="480" y="50" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">Same battlefield moment, two eras: fog, pace, and reinforcement set differently.</text>

  <!-- Left panel: fog-heavy, slow era -->
  <rect x="30" y="70" width="430" height="360" fill="#e9e5da" stroke="#333333" stroke-width="2"/>
  <text x="245" y="95" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Older era — heavy fog, slow supply</text>

  <circle cx="150" cy="220" r="45" fill="#c9c2ad" stroke="#33455c" stroke-width="1.5"/>
  <text x="150" y="224" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Your Line</text>
  <text x="150" y="280" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle">small sensor ring</text>

  <rect x="260" y="330" width="30" height="30" fill="#999999"/>
  <text x="275" y="375" font-family="sans-serif" font-size="10" fill="#777777" text-anchor="middle">enemy — unseen</text>

  <rect x="60" y="130" width="150" height="46" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="135" y="150" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Reinforcement timer</text>
  <text x="135" y="166" font-family="sans-serif" font-size="11" fill="#a33" text-anchor="middle">slow trickle</text>

  <rect x="60" y="360" width="370" height="50" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="245" y="382" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Same units, same categories, same counters as every other era</text>
  <text x="245" y="398" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Fog radius and reinforcement rate: set low for this era</text>

  <!-- Right panel: clear, fast era -->
  <rect x="500" y="70" width="430" height="360" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="715" y="95" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Newer era — thin fog, fast supply</text>

  <circle cx="620" cy="220" r="95" fill="#eef3fb" stroke="#33455c" stroke-width="1.5"/>
  <text x="620" y="224" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Your Line</text>
  <text x="620" y="300" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle">wide sensor ring</text>

  <rect x="770" y="200" width="30" height="30" fill="#c0392b"/>
  <text x="785" y="245" font-family="sans-serif" font-size="10" fill="#777777" text-anchor="middle">enemy — spotted</text>

  <rect x="530" y="130" width="150" height="46" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="605" y="150" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Reinforcement timer</text>
  <text x="605" y="166" font-family="sans-serif" font-size="11" fill="#2a7" text-anchor="middle">fast trickle</text>

  <rect x="530" y="360" width="370" height="50" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="715" y="382" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Same units, same categories, same counters as every other era</text>
  <text x="715" y="398" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Fog radius and reinforcement rate: set high for this era</text>

  <text x="480" y="445" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">Combat rules never change; only the numbers each era's builders set once for fog, pace, and supply.</text>
</svg>
