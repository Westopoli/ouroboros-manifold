<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="#f6f4ee"/>
  <text x="480" y="30" font-family="Georgia, serif" font-size="20" fill="#1a1a1a" text-anchor="middle">Option C — Rise and Roster (wild)</text>
  <text x="480" y="50" font-family="sans-serif" font-size="13" fill="#444" text-anchor="middle">One career, one era: the same five-stage ladder decides which slice of the roster you field.</text>

  <!-- Ladder rungs -->
  <g font-family="sans-serif" font-size="11">
    <rect x="60" y="90" width="150" height="60" rx="6" fill="#f0e6d2" stroke="#8a6d3b" stroke-width="1.5"/>
    <text x="135" y="112" text-anchor="middle" fill="#1a1a1a">Pioneer</text>
    <text x="135" y="130" text-anchor="middle" fill="#555555">scavenged light units</text>

    <rect x="240" y="150" width="150" height="60" rx="6" fill="#dbe4f0" stroke="#33455c" stroke-width="1.5"/>
    <text x="315" y="172" text-anchor="middle" fill="#1a1a1a">Established</text>
    <text x="315" y="190" text-anchor="middle" fill="#555555">full combined roster</text>

    <rect x="420" y="90" width="150" height="60" rx="6" fill="#e6dbf0" stroke="#4a2f6b" stroke-width="1.5"/>
    <text x="495" y="112" text-anchor="middle" fill="#1a1a1a">Imperial</text>
    <text x="495" y="130" text-anchor="middle" fill="#555555">heaviest, rarest units</text>

    <rect x="600" y="150" width="150" height="60" rx="6" fill="#ecdccb" stroke="#6b4a2b" stroke-width="1.5"/>
    <text x="675" y="172" text-anchor="middle" fill="#1a1a1a">Decline</text>
    <text x="675" y="190" text-anchor="middle" fill="#555555">threadbare, mismatched</text>

    <rect x="780" y="90" width="150" height="60" rx="6" fill="#f0e6d2" stroke="#8a6d3b" stroke-width="1.5"/>
    <text x="855" y="112" text-anchor="middle" fill="#1a1a1a">Rebirth</text>
    <text x="855" y="130" text-anchor="middle" fill="#555555">scrappy, salvaged relics</text>
  </g>

  <defs>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
  </defs>
  <path d="M210,120 C225,120 225,180 240,180" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrC)"/>
  <path d="M390,180 C405,180 405,120 420,120" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrC)"/>
  <path d="M570,120 C585,120 585,180 600,180" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrC)"/>
  <path d="M750,180 C765,180 765,120 780,120" stroke="#555555" stroke-width="1.5" fill="none" marker-end="url(#arrC)"/>

  <text x="480" y="245" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">A civilization moves along this arc over a career, in either direction</text>

  <!-- Mission draw indicator -->
  <rect x="270" y="280" width="420" height="70" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="480" y="305" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Mission force draw</text>
  <text x="480" y="325" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">reads current civilization health</text>
  <text x="480" y="341" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="middle">(the same check that already sizes your starting force)</text>

  <line x1="315" y1="210" x2="400" y2="280" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="495" y1="150" x2="470" y2="280" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="675" y1="210" x2="560" y2="280" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <rect x="60" y="390" width="840" height="46" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="480" y="410" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">The era's full roster, categories, counters, and tempo never change.</text>
  <text x="480" y="426" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">Only which rung of the ladder a given mission draws its units from changes — and that is decided for you, not chosen.</text>
</svg>
