<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960" height="620" viewBox="0 0 960 620">
  <rect x="0" y="0" width="960" height="620" fill="#eef1f4"/>
  <text x="20" y="30" font-family="sans-serif" font-size="20" fill="#1a1a1a" font-weight="bold">Option B — Waypoint Chorus (screen wireframe, map band)</text>

  <rect x="20" y="50" width="920" height="500" fill="#b9d6e8" stroke="#333333" stroke-width="2"/>

  <!-- mountains / pass -->
  <polygon points="600,50 700,50 780,220 660,300 560,220" fill="#a8967a" stroke="#5f4f36" stroke-width="1.5"/>
  <text x="640" y="130" font-family="sans-serif" font-size="13" fill="#3a2f1c">Highland</text>

  <!-- pass mouth (waypoint) -->
  <ellipse cx="660" cy="240" rx="34" ry="20" fill="#ffe28a" stroke="#a67c00" stroke-width="2.5"/>
  <text x="590" y="215" font-family="sans-serif" font-size="13" fill="#6b4f00">Eastern pass (glows first)</text>

  <!-- gate / bridge waypoint -->
  <rect x="260" y="330" width="30" height="14" fill="#ffe28a" stroke="#a67c00" stroke-width="2"/>
  <text x="200" y="320" font-family="sans-serif" font-size="12" fill="#6b4f00">Gate</text>

  <!-- objective circle -->
  <circle cx="820" cy="470" r="24" fill="none" stroke="#d9a441" stroke-width="3"/>
  <text x="770" y="510" font-family="sans-serif" font-size="12" fill="#5c4310">Objective circle</text>

  <!-- fields -->
  <rect x="40" y="400" width="180" height="120" fill="#cfe0a8" stroke="#7fa14f" stroke-width="1.5"/>
  <text x="70" y="470" font-family="sans-serif" font-size="13" fill="#3f5721">Fields</text>

  <!-- drag box -->
  <rect x="150" y="200" width="90" height="60" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="195" font-family="sans-serif" font-size="12" fill="#111111">Drag box (every layer)</text>

  <!-- selected group icon -->
  <polygon points="195,220 213,246 177,246" fill="#3f6fd1" stroke="#12275c" stroke-width="1.5"/>
  <text x="150" y="272" font-family="sans-serif" font-size="11" fill="#12275c">Selected reserve</text>

  <!-- order line snapping to waypoint -->
  <path d="M 195 230 C 350 260, 520 260, 640 238" fill="none" stroke="#2b7a4b" stroke-width="3" marker-end="url(#arrowGreenB)"/>
  <rect x="360" y="190" width="230" height="26" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="368" y="208" font-family="sans-serif" font-size="13" fill="#111111">caption: "through the eastern pass"</text>

  <!-- layer marks legend -->
  <polygon points="450,420 470,450 430,450" fill="#3f6fd1" stroke="#12275c" stroke-width="1.5"/>
  <rect x="442" y="416" width="16" height="4" fill="#12275c"/>
  <text x="420" y="408" font-family="sans-serif" font-size="11" fill="#12275c">Upper</text>

  <polygon points="510,420 530,450 490,450" fill="#3f6fd1" stroke="#12275c" stroke-width="1.5"/>
  <rect x="497" y="450" width="16" height="4" fill="#12275c"/>
  <text x="490" y="468" font-family="sans-serif" font-size="11" fill="#12275c">Lower</text>

  <polygon points="570,420 590,450 550,450" fill="#3f6fd1" stroke="#12275c" stroke-width="1.5"/>
  <circle cx="570" cy="435" r="3" fill="#12275c"/>
  <text x="540" y="468" font-family="sans-serif" font-size="11" fill="#12275c">Layer 3 (center dot)</text>

  <polygon points="630,420 650,450 610,450" fill="#3f6fd1" stroke="#12275c" stroke-width="1.5"/>
  <rect x="626" y="416" width="4" height="38" fill="#12275c"/>
  <text x="600" y="408" font-family="sans-serif" font-size="11" fill="#12275c">Expansive</text>

  <!-- pennant on approach -->
  <path d="M 660 250 L 660 270 L 672 262 Z" fill="#c73b3b" stroke="#5c1010" stroke-width="1"/>
  <text x="680" y="270" font-family="sans-serif" font-size="11" fill="#5c1010">Pennant at destination</text>

  <defs>
    <marker id="arrowGreenB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#2b7a4b"/>
    </marker>
  </defs>

  <text x="20" y="580" font-family="sans-serif" font-size="12" fill="#333333">Terrain features surface a beat before group icons; the order line settles onto the nearest one.</text>
</svg>
