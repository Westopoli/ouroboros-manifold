<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960" height="620" viewBox="0 0 960 620">
  <defs>
    <radialGradient id="warmLight" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="70%" stop-color="#f0d9a8"/>
      <stop offset="100%" stop-color="#c9ad78"/>
    </radialGradient>
    <radialGradient id="softEdge" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a3226" stop-opacity="0.35"/>
    </radialGradient>
    <marker id="flagMarker" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <rect x="4" y="0" width="2" height="12" fill="#1c4b2f"/>
      <polygon points="6,1 12,4 6,7" fill="#1c4b2f"/>
    </marker>
    <marker id="crossMarker" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <line x1="0" y1="0" x2="12" y2="12" stroke="#5c1010" stroke-width="2"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="#5c1010" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#e7ded0"/>
  <text x="20" y="30" font-family="sans-serif" font-size="20" fill="#1a1a1a" font-weight="bold">Option C — The Sand Table (screen wireframe, map band, wild)</text>

  <!-- table / model surface -->
  <rect x="20" y="50" width="920" height="500" fill="url(#warmLight)" stroke="#5f4f36" stroke-width="2"/>

  <!-- ridge (raised terrain, still 3D) -->
  <polygon points="560,80 700,80 760,220 640,260 540,200" fill="#b79e78" stroke="#6b5738" stroke-width="1.5"/>
  <polygon points="580,100 690,100 730,210 640,235 570,190" fill="#c9b28c" stroke="#6b5738" stroke-width="1"/>
  <text x="600" y="150" font-family="sans-serif" font-size="13" fill="#4a3c22">Ridge (real height, not flat)</text>

  <!-- valley haze, lower left, clear of pins -->
  <ellipse cx="150" cy="480" rx="110" ry="45" fill="#cfd7d2" opacity="0.55"/>
  <text x="30" y="545" font-family="sans-serif" font-size="13" fill="#3f4a44">Haze pools in the valley (unseen)</text>

  <!-- river -->
  <path d="M 120 60 C 180 200, 250 300, 300 500" fill="none" stroke="#5f8fb8" stroke-width="10" opacity="0.7"/>

  <!-- table edge / tilt-shift blur, under all markers so pins and threads stay crisp -->
  <rect x="20" y="50" width="920" height="500" fill="url(#softEdge)"/>

  <!-- drag box across table, encloses the three selected pins -->
  <rect x="330" y="320" width="395" height="150" fill="none" stroke="#2a2016" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="310" font-family="sans-serif" font-size="12" fill="#2a2016">Drag box (every unit, every layer)</text>

  <!-- pins: Upper (tall spiked), Lower (short sunk), Expansive (full rod), layer-3 (resting), spaced 145-150px apart -->
  <line x1="380" y1="460" x2="380" y2="390" stroke="#2b4d7a" stroke-width="4"/>
  <polygon points="380,390 388,404 372,404" fill="#2b4d7a"/>
  <text x="380" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">Upper (4–5)</text>
  <text x="380" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">tall, spiked</text>

  <line x1="530" y1="460" x2="530" y2="445" stroke="#2b4d7a" stroke-width="4"/>
  <circle cx="530" cy="443" r="5" fill="#2b4d7a"/>
  <text x="530" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">Lower (1–2)</text>
  <text x="530" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">short, sunk</text>

  <line x1="675" y1="460" x2="675" y2="350" stroke="#2b4d7a" stroke-width="5"/>
  <circle cx="675" cy="348" r="5" fill="#2b4d7a"/>
  <text x="675" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">Expansive (1–5)</text>
  <text x="675" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">full rod</text>

  <line x1="800" y1="460" x2="800" y2="420" stroke="#2b4d7a" stroke-width="4"/>
  <circle cx="800" cy="418" r="5" fill="#2b4d7a"/>
  <text x="800" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">Layer 3</text>
  <text x="800" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#12275c">(resting)</text>

  <!-- enemy pin, visible only in vision, well clear of layer-3 pin -->
  <line x1="895" y1="460" x2="895" y2="400" stroke="#8a2020" stroke-width="4"/>
  <circle cx="895" cy="398" r="5" fill="#8a2020"/>
  <text x="895" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c1010">Enemy</text>
  <text x="895" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c1010">(in vision)</text>

  <!-- thread of light: move order, routed above the drag box and below the ridge -->
  <path d="M 675 340 C 700 300, 830 305, 920 345" fill="none" stroke="#7fc9a8" stroke-width="3" marker-end="url(#flagMarker)"/>
  <text x="680" y="290" font-family="sans-serif" font-size="12" fill="#1c4b2f">Move order — cool thread, flag end</text>

  <!-- thread: attack-move, routed below the pin labels and above the caption -->
  <path d="M 530 452 C 620 560, 800 560, 890 410" fill="none" stroke="#c9645a" stroke-width="3" marker-end="url(#crossMarker)"/>
  <text x="560" y="530" font-family="sans-serif" font-size="12" fill="#5c1010">Attack-move — hot, crossed flags</text>

  <text x="20" y="580" font-family="sans-serif" font-size="12" fill="#3a2f1c">No grid. Terrain never flattens; light warms and edges soften instead.</text>
</svg>
