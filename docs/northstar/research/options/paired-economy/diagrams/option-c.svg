<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 960 620" width="960" height="620">
  <rect x="0" y="0" width="960" height="620" fill="#f4f1e8"/>
  <text x="480" y="30" font-family="Georgia, serif" font-size="20" fill="#1a1a1a" text-anchor="middle">The Commons — the economy player's screen, one moment</text>

  <!-- population bar -->
  <rect x="20" y="50" width="920" height="40" fill="#e8dcc0" stroke="#8a7245" stroke-width="2"/>
  <text x="40" y="75" font-family="Georgia, serif" font-size="13" fill="#1a1a1a">Households: 9</text>
  <text x="190" y="75" font-family="Georgia, serif" font-size="13" fill="#1a1a1a">Guilds formed: 2</text>
  <text x="340" y="75" font-family="Georgia, serif" font-size="13" fill="#1a1a1a">Housing (supply): 38 / 45</text>
  <text x="560" y="75" font-family="Georgia, serif" font-size="13" fill="#1a1a1a">Tech: guild specialization II</text>

  <!-- shared tactical map -->
  <rect x="60" y="110" width="840" height="380" fill="#dfe7d3" stroke="#5b7a3a" stroke-width="2"/>
  <text x="480" y="130" font-family="Georgia, serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Shared Tactical Map</text>

  <!-- city core / walls -->
  <rect x="380" y="160" width="200" height="140" rx="4" fill="#e8dcc0" stroke="#8a7245" stroke-width="2"/>
  <text x="480" y="180" font-family="Georgia, serif" font-size="11" fill="#1a1a1a" text-anchor="middle">City Core</text>
  <line x1="380" y1="200" x2="580" y2="200" stroke="#8a7245" stroke-width="3"/>
  <text x="480" y="215" font-family="Georgia, serif" font-size="9" fill="#1a1a1a" text-anchor="middle">wall (household-built)</text>

  <!-- individual household icons with need bars -->
  <g>
    <circle cx="420" cy="240" r="10" fill="#3a6b8a"/>
    <text x="420" y="262" font-family="Georgia, serif" font-size="8" fill="#1a1a1a" text-anchor="middle">Ashford</text>
    <rect x="405" y="266" width="30" height="5" fill="#5b8a3a"/>
    <text x="420" y="284" font-family="Georgia, serif" font-size="7" fill="#4a7a2a" text-anchor="middle">safety: high</text>
  </g>
  <g>
    <circle cx="540" cy="240" r="10" fill="#3a6b8a"/>
    <text x="540" y="262" font-family="Georgia, serif" font-size="8" fill="#1a1a1a" text-anchor="middle">Colver</text>
    <rect x="525" y="266" width="30" height="5" fill="#8a3a1a"/>
    <text x="540" y="284" font-family="Georgia, serif" font-size="7" fill="#7a1a1a" text-anchor="middle">safety: spiking</text>
  </g>

  <!-- raiders near Colver -->
  <polygon points="600,235 615,250 600,265 585,250" fill="#7a1a1a"/>
  <text x="600" y="285" font-family="Georgia, serif" font-size="8" fill="#7a1a1a" text-anchor="middle">raiders</text>
  <line x1="585" y1="250" x2="552" y2="245" stroke="#7a1a1a" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- guild icon, automated -->
  <g>
    <rect x="140" y="330" width="100" height="60" fill="#c9b98a" stroke="#4a7a2a" stroke-width="2"/>
    <text x="190" y="352" font-family="Georgia, serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Millwright Guild</text>
    <text x="190" y="366" font-family="Georgia, serif" font-size="8" fill="#4a7a2a" text-anchor="middle">self-assigning</text>
    <text x="190" y="378" font-family="Georgia, serif" font-size="8" fill="#4a7a2a" text-anchor="middle">(automation upgrade)</text>
  </g>

  <!-- garrison fed by household -->
  <g>
    <rect x="700" y="330" width="100" height="60" fill="#d7c9a0" stroke="#8a7245" stroke-width="2"/>
    <text x="750" y="352" font-family="Georgia, serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Garrison</text>
    <text x="750" y="366" font-family="Georgia, serif" font-size="8" fill="#1a1a1a" text-anchor="middle">crewed by</text>
    <text x="750" y="378" font-family="Georgia, serif" font-size="8" fill="#1a1a1a" text-anchor="middle">Torvald household</text>
  </g>
  <circle cx="700" cy="360" r="8" fill="#3a6b8a"/>

  <!-- ticker panel -->
  <rect x="60" y="500" width="840" height="90" fill="#eee8d8" stroke="#8a7245" stroke-width="2"/>
  <text x="480" y="520" font-family="Georgia, serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Ticker (both players see this)</text>
  <text x="80" y="542" font-family="Georgia, serif" font-size="10" fill="#7a3a1a">"Colver household: safety need spiking — shelter or relocate"</text>
  <text x="80" y="560" font-family="Georgia, serif" font-size="10" fill="#4a7a2a">"Ashford household: granary raised under fire"</text>
  <text x="80" y="578" font-family="Georgia, serif" font-size="10" fill="#1a1a1a">"Millwright Guild formed — no longer needs individual orders"</text>

  <text x="480" y="610" font-family="Georgia, serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Households read like friendly units; a wavering need bar near the front is a warning the commander can act on directly.</text>
</svg>
