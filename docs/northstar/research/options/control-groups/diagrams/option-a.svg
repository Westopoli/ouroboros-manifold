<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" version="1.1">
  <rect x="0" y="0" width="960" height="540" fill="#f4f2ec"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1c1c1c" font-weight="bold">Option A — Recall and Narrow</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a44">Screen state: army 2 recalled, then narrowed to layer 4</text>

  <!-- viewport frame -->
  <rect x="24" y="72" width="912" height="300" fill="#dedad0" stroke="#8a8578" stroke-width="1"/>
  <text x="40" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">battlefield viewport</text>

  <!-- line force layer 2, greyed (not in narrowed selection) -->
  <g opacity="0.35">
    <circle cx="200" cy="260" r="10" fill="#7a8f6a"/>
    <circle cx="225" cy="255" r="10" fill="#7a8f6a"/>
    <circle cx="250" cy="262" r="10" fill="#7a8f6a"/>
    <circle cx="275" cy="256" r="10" fill="#7a8f6a"/>
    <text x="190" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">line force — layer 2 (not selected)</text>
  </g>

  <!-- strike wing layer 4, highlighted with selection rings -->
  <g>
    <circle cx="400" cy="150" r="11" fill="#4a78c2" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="428" cy="145" r="11" fill="#4a78c2" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="456" cy="152" r="11" fill="#4a78c2" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="484" cy="146" r="11" fill="#4a78c2" stroke="#1c1c1c" stroke-width="2"/>
    <rect x="380" y="120" width="126" height="50" fill="none" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="380" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1c" font-weight="bold">strike wing — layer 4 (selected)</text>
  </g>

  <!-- move order arrow -->
  <line x1="490" y1="148" x2="650" y2="110" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c">right-click move (layer 4 kept)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <!-- layer strip -->
  <g>
    <rect x="880" y="90" width="40" height="260" fill="#efece4" stroke="#8a8578"/>
    <text x="900" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44" text-anchor="middle">layers</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="middle">
      <rect x="884" y="98" width="32" height="44" fill="#e3dfd3" stroke="#8a8578"/>
      <text x="900" y="124">5</text>
      <rect x="884" y="142" width="32" height="44" fill="#c9d8ee" stroke="#1c1c1c" stroke-width="2"/>
      <text x="900" y="168">4</text>
      <rect x="884" y="186" width="32" height="44" fill="#e3dfd3" stroke="#8a8578"/>
      <text x="900" y="212">3</text>
      <rect x="884" y="230" width="32" height="44" fill="#dfe7d6" stroke="#8a8578"/>
      <text x="900" y="256">2</text>
      <rect x="884" y="274" width="32" height="44" fill="#e3dfd3" stroke="#8a8578"/>
      <text x="900" y="300">1</text>
    </g>
    <text x="900" y="364" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44" text-anchor="middle">focus unmoved</text>
  </g>

  <!-- HUD bottom bar -->
  <rect x="24" y="392" width="912" height="124" fill="#e9e6dd" stroke="#8a8578"/>
  <text x="40" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a44" font-weight="bold">control group tabs</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12">
    <rect x="40" y="424" width="90" height="60" fill="#efece4" stroke="#8a8578"/>
    <text x="85" y="440" text-anchor="middle" fill="#1c1c1c">1</text>
    <text x="85" y="458" text-anchor="middle" fill="#4a4a44">Vanguard</text>
    <text x="85" y="474" text-anchor="middle" fill="#4a4a44">x22</text>

    <rect x="140" y="424" width="90" height="60" fill="#fff6d8" stroke="#1c1c1c" stroke-width="2"/>
    <text x="185" y="440" text-anchor="middle" fill="#1c1c1c" font-weight="bold">2</text>
    <text x="185" y="458" text-anchor="middle" fill="#4a4a44">mixed</text>
    <text x="185" y="474" text-anchor="middle" fill="#4a4a44">x38 (recalled)</text>

    <rect x="240" y="424" width="90" height="60" fill="#efece4" stroke="#8a8578"/>
    <text x="285" y="440" text-anchor="middle" fill="#1c1c1c">3</text>
    <text x="285" y="458" text-anchor="middle" fill="#4a4a44">Bombard</text>
    <text x="285" y="474" text-anchor="middle" fill="#4a4a44">x9</text>

    <rect x="340" y="424" width="90" height="60" fill="#efece4" stroke="#8a8578" stroke-dasharray="3 3"/>
    <text x="385" y="440" text-anchor="middle" fill="#4a4a44">4</text>
    <text x="385" y="458" text-anchor="middle" fill="#4a4a44">empty</text>
    <text x="385" y="474" text-anchor="middle" fill="#4a4a44">bind target</text>
  </g>

  <text x="470" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1c">selection panel: 4 raiders (narrowed to layer 4)</text>
  <text x="470" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">tab "2" still reads 38 — narrow does not change group membership</text>
  <text x="470" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">Ctrl+4 binds this narrowed set; the 4 leave group 2 at once</text>
</svg>
