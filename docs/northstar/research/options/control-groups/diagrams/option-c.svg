<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" version="1.1">
  <rect x="0" y="0" width="960" height="540" fill="#f4f2ec"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1c1c1c" font-weight="bold">Option C — The Comb (wild)</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a44">Screen state: digit 3 held, strip bloomed, drag spans layer 2 through layer 3</text>

  <rect x="24" y="72" width="912" height="280" fill="#dedad0" stroke="#8a8578" stroke-width="1"/>
  <text x="40" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">battlefield viewport — army 3, scattered across four layers</text>

  <!-- layer 5 raiders, dim (not combed) -->
  <g opacity="0.35">
    <circle cx="700" cy="120" r="9" fill="#8a5fa8"/>
    <circle cx="722" cy="116" r="9" fill="#8a5fa8"/>
    <text x="660" y="105" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">Raiders — layer 5</text>
  </g>
  <!-- layer 4 bombard, dim -->
  <g opacity="0.35">
    <rect x="690" y="160" width="20" height="20" fill="#c2703a"/>
    <text x="660" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">Bombard — layer 4</text>
  </g>

  <!-- layer 3 vanguards, selected -->
  <g>
    <circle cx="300" cy="220" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="325" cy="216" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="350" cy="222" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <text x="290" y="252" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c" font-weight="bold">Vanguards — layer 3 (combed)</text>
  </g>
  <!-- layer 2 wardens, selected -->
  <g>
    <rect x="290" y="270" width="18" height="18" fill="#7a8f6a" stroke="#1c1c1c" stroke-width="2"/>
    <rect x="315" y="270" width="18" height="18" fill="#7a8f6a" stroke="#1c1c1c" stroke-width="2"/>
    <rect x="340" y="270" width="18" height="18" fill="#7a8f6a" stroke="#1c1c1c" stroke-width="2"/>
    <text x="290" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c" font-weight="bold">Wardens — layer 2 (combed)</text>
  </g>

  <rect x="270" y="200" width="120" height="96" fill="none" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- bloomed layer strip as bar chart -->
  <g>
    <text x="820" y="82" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a44" text-anchor="middle">bloomed strip (digit 3 held)</text>
    <rect x="760" y="94" width="160" height="230" fill="#efece4" stroke="#8a8578"/>

    <!-- layer 5 bar, small -->
    <text x="770" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c">L5</text>
    <rect x="795" y="106" width="24" height="16" fill="#c8b7d6" stroke="#8a8578"/>
    <text x="826" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44">2 units</text>

    <!-- layer 4 bar, small -->
    <text x="770" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c">L4</text>
    <rect x="795" y="138" width="30" height="16" fill="#e6b494" stroke="#8a8578"/>
    <text x="832" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44">1 unit</text>

    <!-- layer 3 bar, large, dragged -->
    <text x="770" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c" font-weight="bold">L3</text>
    <rect x="795" y="170" width="90" height="24" fill="#f6e2c2" stroke="#1c1c1c" stroke-width="2"/>
    <text x="892" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c">18</text>

    <!-- drag arrow spanning L3-L2 -->
    <line x1="805" y1="182" x2="805" y2="236" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="2 2" marker-end="url(#arrowc)"/>

    <!-- layer 2 bar, large, dragged -->
    <text x="770" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c" font-weight="bold">L2</text>
    <rect x="795" y="214" width="100" height="24" fill="#dfe7d6" stroke="#1c1c1c" stroke-width="2"/>
    <text x="902" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c">20</text>

    <!-- layer 1 bar, empty -->
    <text x="770" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">L1</text>
    <text x="795" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44">0 units</text>

    <text x="840" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c">drag spans L2-L3</text>
  </g>

  <defs>
    <marker id="arrowc" markerWidth="10" markerHeight="10" refX="4" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,0 L4,9 z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <!-- HUD bottom bar -->
  <rect x="24" y="368" width="912" height="148" fill="#e9e6dd" stroke="#8a8578"/>
  <text x="40" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a44" font-weight="bold">control group tabs (at rest — no clutter)</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12">
    <rect x="40" y="402" width="100" height="40" fill="#efece4" stroke="#8a8578"/>
    <text x="90" y="426" text-anchor="middle">1 — 22 units</text>

    <rect x="150" y="402" width="100" height="40" fill="#efece4" stroke="#8a8578"/>
    <text x="200" y="426" text-anchor="middle">2 — 16 units</text>

    <rect x="260" y="402" width="120" height="40" fill="#fff6d8" stroke="#1c1c1c" stroke-width="2"/>
    <text x="320" y="426" text-anchor="middle" font-weight="bold">3 — 31 units (held)</text>
  </g>

  <text x="40" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1c">selection: Wardens + Vanguards, 38 units, disengage order issued</text>
  <text x="40" y="490" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">releasing digit 3 collapses the bloom back to five thin rings</text>
</svg>
