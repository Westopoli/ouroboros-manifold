<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" version="1.1">
  <rect x="0" y="0" width="960" height="540" fill="#f4f2ec"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1c1c1c" font-weight="bold">Option B — Layer Sub-Tabs</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a44">Screen state: three armies bound; army 1's layer-3 chip held/chorded</text>

  <rect x="24" y="72" width="912" height="290" fill="#dedad0" stroke="#8a8578" stroke-width="1"/>
  <text x="40" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">battlefield viewport</text>

  <!-- layer 2 Bastions, dim -->
  <g opacity="0.35">
    <rect x="180" y="240" width="18" height="18" fill="#7a8f6a"/>
    <rect x="205" y="240" width="18" height="18" fill="#7a8f6a"/>
    <rect x="230" y="240" width="18" height="18" fill="#7a8f6a"/>
    <text x="180" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">Bastions — layer 2 (not selected)</text>
  </g>

  <!-- layer 3 Vanguards, highlighted -->
  <g>
    <circle cx="330" cy="180" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="355" cy="176" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="380" cy="182" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="405" cy="177" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="430" cy="181" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <circle cx="455" cy="176" r="10" fill="#c28a3a" stroke="#1c1c1c" stroke-width="2"/>
    <rect x="316" y="160" width="153" height="38" fill="none" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="316" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1c" font-weight="bold">Vanguards — layer 3 (selected via chip)</text>
  </g>

  <line x1="460" y1="178" x2="600" y2="220" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="470" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1c1c">right-click move — layer 3 kept</text>

  <defs>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <!-- HUD bottom bar with sub tabs -->
  <rect x="24" y="380" width="912" height="136" fill="#e9e6dd" stroke="#8a8578"/>
  <text x="40" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a44" font-weight="bold">control group tabs with layer chips</text>

  <!-- army 1 tab, expanded, chorded -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12">
    <rect x="40" y="412" width="140" height="34" fill="#fff6d8" stroke="#1c1c1c" stroke-width="2"/>
    <text x="110" y="434" text-anchor="middle" fill="#1c1c1c" font-weight="bold">1 — army (20)</text>

    <rect x="40" y="450" width="68" height="26" fill="#dfe7d6" stroke="#8a8578"/>
    <text x="74" y="468" text-anchor="middle" fill="#1c1c1c">L2: 14</text>

    <rect x="112" y="450" width="68" height="26" fill="#f6e2c2" stroke="#1c1c1c" stroke-width="2"/>
    <text x="146" y="468" text-anchor="middle" fill="#1c1c1c" font-weight="bold">L3: 6 (held)</text>

    <!-- army 2 tab, single layer, no chips -->
    <rect x="200" y="412" width="120" height="34" fill="#efece4" stroke="#8a8578"/>
    <text x="260" y="434" text-anchor="middle" fill="#1c1c1c">2 — army (16)</text>
    <text x="260" y="465" text-anchor="middle" font-size="10" fill="#4a4a44">single layer: no chips</text>

    <!-- army 3 tab, three chips -->
    <rect x="340" y="412" width="220" height="34" fill="#efece4" stroke="#8a8578"/>
    <text x="450" y="434" text-anchor="middle" fill="#1c1c1c">3 — army (31)</text>

    <rect x="340" y="450" width="68" height="26" fill="#dfe7d6" stroke="#8a8578"/>
    <text x="374" y="468" text-anchor="middle" font-size="11">L2: 9</text>
    <rect x="412" y="450" width="68" height="26" fill="#f6e2c2" stroke="#8a8578"/>
    <text x="446" y="468" text-anchor="middle" font-size="11">L3: 14</text>
    <rect x="484" y="450" width="68" height="26" fill="#c9d8ee" stroke="#8a8578"/>
    <text x="518" y="468" text-anchor="middle" font-size="11">L4: 8</text>
  </g>

  <text x="600" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c1c1c">selection: 6 Vanguards (army 1, layer-3 chip)</text>
  <text x="600" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">hold "1", tap "3" — one chord, or click the chip</text>
  <text x="600" y="464" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">tab "1" still reads 20 — chips are a shortcut, not new groups</text>
</svg>
