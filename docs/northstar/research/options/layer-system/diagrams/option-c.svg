<text x="872" y="34" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a1a1a">bare shimmer</text>
<text x="24" y="586" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#55534c">Grid: replaced by breathing rings; a unit's layer reads by which height's ring is brightest and fastest, not by a fixed shape.</text>
