<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" version="1.1">
  <rect x="0" y="0" width="960" height="620" fill="#f4f1ea"/>
  <text x="30" y="38" font-family="Georgia, serif" font-size="22" fill="#20202a" font-weight="bold">The Muster — dealt-hand briefing screen</text>
  <text x="30" y="60" font-family="Georgia, serif" font-size="13" fill="#4a4a55">Five cards, dealt onto five named units already in your force. One reshuffle allowed.</text>

  <!-- Dealt hand: 5 unit portraits with a card each -->
  <g font-family="Georgia, serif">
    <!-- Unit 1: Voss -->
    <rect x="30" y="90" width="170" height="150" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
    <circle cx="115" cy="140" r="30" fill="#d8cba8" stroke="#8a7a52" stroke-width="2"/>
    <text x="115" y="146" font-size="12" text-anchor="middle" fill="#20202a">Raider</text>
    <text x="115" y="182" font-size="13" text-anchor="middle" fill="#20202a" font-weight="bold">Voss</text>
    <rect x="45" y="192" width="140" height="38" rx="6" fill="#fdeeea" stroke="#a04030" stroke-width="2"/>
    <text x="115" y="208" font-size="11" text-anchor="middle" fill="#6a2418" font-weight="bold">Second Wind</text>
    <text x="115" y="222" font-size="9" text-anchor="middle" fill="#7a4030">flee at 2x speed, once, instead of dying</text>

    <!-- Unit 2: Kade -->
    <rect x="210" y="90" width="170" height="150" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
    <circle cx="295" cy="140" r="30" fill="#d8cba8" stroke="#8a7a52" stroke-width="2"/>
    <text x="295" y="146" font-size="12" text-anchor="middle" fill="#20202a">Raider</text>
    <text x="295" y="182" font-size="13" text-anchor="middle" fill="#20202a" font-weight="bold">Kade</text>
    <rect x="225" y="192" width="140" height="38" rx="6" fill="#eef3e6" stroke="#5c8a3c" stroke-width="2"/>
    <text x="295" y="208" font-size="11" text-anchor="middle" fill="#2f4a20" font-weight="bold">Ambush Reflexes</text>
    <text x="295" y="222" font-size="9" text-anchor="middle" fill="#4a5a40">+ damage on first hit from flank</text>

    <!-- Unit 3: Bastion crew -->
    <rect x="390" y="90" width="170" height="150" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
    <circle cx="475" cy="140" r="30" fill="#d8b9b9" stroke="#8a4c4c" stroke-width="2"/>
    <text x="475" y="146" font-size="12" text-anchor="middle" fill="#20202a">Bastion</text>
    <text x="475" y="182" font-size="13" text-anchor="middle" fill="#20202a" font-weight="bold">Orr</text>
    <rect x="405" y="192" width="140" height="38" rx="6" fill="#f6f0e8" stroke="#8a6a3c" stroke-width="2"/>
    <text x="475" y="208" font-size="11" text-anchor="middle" fill="#4a3a20" font-weight="bold">Rationed</text>
    <text x="475" y="222" font-size="9" text-anchor="middle" fill="#5a4a30">-10% upkeep drag, -5% HP</text>

    <!-- Unit 4: Warden -->
    <rect x="570" y="90" width="170" height="150" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
    <circle cx="655" cy="140" r="30" fill="#b9c7d8" stroke="#4c6a8a" stroke-width="2"/>
    <text x="655" y="146" font-size="12" text-anchor="middle" fill="#20202a">Warden</text>
    <text x="655" y="182" font-size="13" text-anchor="middle" fill="#20202a" font-weight="bold">Priya</text>
    <rect x="585" y="192" width="140" height="38" rx="6" fill="#f0e8f6" stroke="#6a3c8a" stroke-width="2"/>
    <text x="655" y="208" font-size="11" text-anchor="middle" fill="#3a2050" font-weight="bold">Steady Hands</text>
    <text x="655" y="222" font-size="9" text-anchor="middle" fill="#4a3060">+ heal per tick in aura</text>

    <!-- Unit 5: Vanguard -->
    <rect x="750" y="90" width="170" height="150" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
    <circle cx="835" cy="140" r="30" fill="#b9c7d8" stroke="#4c6a8a" stroke-width="2"/>
    <text x="835" y="146" font-size="12" text-anchor="middle" fill="#20202a">Vanguard</text>
    <text x="835" y="182" font-size="13" text-anchor="middle" fill="#20202a" font-weight="bold">Rell</text>
    <rect x="765" y="192" width="140" height="38" rx="6" fill="#eef0f6" stroke="#4c5a8a" stroke-width="2"/>
    <text x="835" y="208" font-size="11" text-anchor="middle" fill="#28304a" font-weight="bold">Grim Ledger</text>
    <text x="835" y="222" font-size="9" text-anchor="middle" fill="#38406a">no falter on ally death nearby</text>
  </g>

  <!-- reshuffle arrow between Voss and a different Raider (Kade slot) -->
  <path d="M 115 260 C 180 300, 230 300, 295 260" fill="none" stroke="#6a3c8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="205" y="300" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#3a2050">one reshuffle: move Second Wind to a Raider you trust at the front</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a3c8a"/>
    </marker>
  </defs>

  <!-- Weighting note tied to chronicle -->
  <rect x="30" y="340" width="890" height="90" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
  <text x="45" y="365" font-family="Georgia, serif" font-size="13" fill="#20202a" font-weight="bold">Draw weighting, not exclusive access</text>
  <text x="45" y="388" font-family="Georgia, serif" font-size="12" fill="#4a4a55">Your civilization's insurgency history nudges "Ambush Reflexes" to appear more often in your hand.</text>
  <text x="45" y="408" font-family="Georgia, serif" font-size="12" fill="#4a4a55">The enemy draws from the same pool, at the same hand size of five — the lean is flavor, never an edge.</text>

  <!-- In-fight legibility -->
  <rect x="30" y="450" width="890" height="140" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.5"/>
  <text x="45" y="475" font-family="Georgia, serif" font-size="13" fill="#20202a" font-weight="bold">In the fight — only the dealt unit carries the icon</text>
  <circle cx="90" cy="530" r="22" fill="#d8cba8" stroke="#8a7a52" stroke-width="2"/>
  <rect x="102" y="518" width="14" height="14" rx="3" fill="#a04030"/>
  <text x="130" y="525" font-family="Georgia, serif" font-size="12" fill="#20202a" font-weight="bold">Voss — carries the Second Wind icon</text>
  <text x="130" y="542" font-family="Georgia, serif" font-size="11" fill="#6a6a70">takes a killing hit, sprints clear for 3s, then drops</text>

  <circle cx="90" cy="570" r="22" fill="#d8cba8" stroke="#8a7a52" stroke-width="2"/>
  <text x="130" y="565" font-family="Georgia, serif" font-size="12" fill="#20202a">Every other Raider — no icon, no card</text>
  <text x="130" y="580" font-family="Georgia, serif" font-size="11" fill="#6a6a70">same type, dealt nothing this mission</text>
</svg>
