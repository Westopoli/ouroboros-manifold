<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" version="1.1">
  <rect x="0" y="0" width="960" height="540" fill="#f4f2ec"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1c1c1c" font-weight="bold">Option A — The Long Horizon</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a44">A civilization's own reach, tracked by the chronicle, decides when the jump crosses</text>

  <!-- chapter track -->
  <rect x="24" y="80" width="912" height="230" fill="#dedad0" stroke="#8a8578"/>
  <text x="40" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">chapters played in this age</text>

  <!-- reach gauge rising -->
  <polyline points="60,270 180,255 300,235 420,205 540,165 620,120" fill="none" stroke="#4a78c2" stroke-width="3"/>
  <circle cx="60" cy="270" r="5" fill="#4a78c2"/>
  <circle cx="180" cy="255" r="5" fill="#4a78c2"/>
  <circle cx="300" cy="235" r="5" fill="#4a78c2"/>
  <circle cx="420" cy="205" r="5" fill="#4a78c2"/>
  <circle cx="540" cy="165" r="5" fill="#4a78c2"/>
  <circle cx="620" cy="120" r="6" fill="#c0392b" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="30" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">leading civilization's reach</text>

  <!-- ceiling line -->
  <line x1="24" y1="120" x2="936" y2="120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="115" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b">ceiling this age can hold</text>

  <!-- chronicle callouts along the way -->
  <text x="150" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44">chapter 4</text>
  <text x="270" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44">chapter 6</text>
  <text x="510" y="292" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4a4a44">chapter 9</text>

  <rect x="330" y="140" width="230" height="46" fill="#fff6d8" stroke="#8a8578"/>
  <text x="340" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c">chronicle: "workshops running</text>
  <text x="340" y="170" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c">past what the old ways explain"</text>

  <rect x="590" y="90" width="230" height="46" fill="#fbe0dc" stroke="#c0392b"/>
  <text x="600" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c" font-weight="bold">chapter 10: reach tops out —</text>
  <text x="600" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1c1c1c" font-weight="bold">this jump crosses the boundary</text>

  <!-- crossing arrow down to era chain -->
  <line x1="620" y1="120" x2="620" y2="340" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowA)"/>
  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <!-- era chain -->
  <text x="40" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">the campaign's owned ages, in order, with the loop after the last</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="60" y="350" width="170" height="60" fill="#e3dfd3" stroke="#8a8578"/>
    <text x="145" y="384" fill="#1c1c1c">age owned first</text>

    <line x1="230" y1="380" x2="290" y2="380" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowA)"/>

    <rect x="290" y="350" width="170" height="60" fill="#c9d8ee" stroke="#1c1c1c" stroke-width="2"/>
    <text x="375" y="378" fill="#1c1c1c" font-weight="bold">age owned</text>
    <text x="375" y="396" fill="#1c1c1c" font-weight="bold">second (rescaled)</text>

    <line x1="460" y1="380" x2="520" y2="380" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowA)"/>

    <rect x="520" y="350" width="170" height="60" fill="#e3dfd3" stroke="#8a8578"/>
    <text x="605" y="384" fill="#1c1c1c">age owned third</text>

    <line x1="690" y1="380" x2="750" y2="380" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowA)"/>

    <rect x="750" y="350" width="150" height="60" fill="#dfe7d6" stroke="#8a8578"/>
    <text x="825" y="378" fill="#1c1c1c">no next pack:</text>
    <text x="825" y="396" fill="#1c1c1c">common set only</text>
  </g>

  <!-- loop back -->
  <path d="M 750 420 C 500 470, 300 470, 145 420" fill="none" stroke="#4a78c2" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowA)"/>
  <text x="440" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a44">history loops: reach keeps being read past the last owned age</text>

  <rect x="24" y="500" width="912" height="26" fill="#e9e6dd" stroke="#8a8578"/>
  <text x="40" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">named commanders from a closed age reappear in the chronicle only as sayings and place names, fewer each jump after</text>
</svg>
