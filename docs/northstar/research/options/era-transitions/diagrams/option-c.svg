<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" version="1.1">
  <rect x="0" y="0" width="960" height="540" fill="#f4f2ec"/>
  <text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1c1c1c" font-weight="bold">Option C — The Last Word (wild)</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a44">The chronicle's own category mix, running dry, decides when the jump crosses</text>

  <!-- chronicle panels across jumps -->
  <rect x="24" y="76" width="912" height="230" fill="#dedad0" stroke="#8a8578"/>
  <text x="40" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">the same handful of chronicle categories repeat across jumps</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11">
    <!-- jump 1 -->
    <rect x="50" y="112" width="190" height="170" fill="#efece4" stroke="#8a8578"/>
    <text x="60" y="130" fill="#1c1c1c" font-weight="bold">jump 1 chronicle</text>
    <rect x="60" y="140" width="170" height="18" fill="#dfe7d6"/><text x="65" y="153" fill="#1c1c1c">lineage_thrived</text>
    <rect x="60" y="162" width="170" height="18" fill="#c9d8ee"/><text x="65" y="175" fill="#1c1c1c">chain_expansion</text>
    <rect x="60" y="184" width="170" height="18" fill="#fff6d8"/><text x="65" y="197" fill="#1c1c1c">regional_growth</text>

    <!-- jump 2 -->
    <rect x="260" y="112" width="190" height="170" fill="#efece4" stroke="#8a8578"/>
    <text x="270" y="130" fill="#1c1c1c" font-weight="bold">jump 2 chronicle</text>
    <rect x="270" y="140" width="170" height="18" fill="#dfe7d6"/><text x="275" y="153" fill="#1c1c1c">lineage_thrived</text>
    <rect x="270" y="162" width="170" height="18" fill="#c9d8ee"/><text x="275" y="175" fill="#1c1c1c">chain_expansion</text>
    <rect x="270" y="184" width="170" height="18" fill="#fff6d8"/><text x="275" y="197" fill="#1c1c1c">regional_growth</text>
    <text x="270" y="220" fill="#c0392b" font-size="10">same three categories again</text>

    <!-- jump 3 -->
    <rect x="470" y="112" width="190" height="170" fill="#efece4" stroke="#8a8578"/>
    <text x="480" y="130" fill="#1c1c1c" font-weight="bold">jump 3 chronicle</text>
    <rect x="480" y="140" width="170" height="18" fill="#dfe7d6"/><text x="485" y="153" fill="#1c1c1c">lineage_thrived</text>
    <rect x="480" y="162" width="170" height="18" fill="#c9d8ee"/><text x="485" y="175" fill="#1c1c1c">chain_expansion</text>
    <rect x="480" y="184" width="170" height="18" fill="#fff6d8"/><text x="485" y="197" fill="#1c1c1c">regional_growth</text>
    <text x="480" y="220" fill="#c0392b" font-size="10">this age's stock is spent</text>

    <!-- jump 4: closing entry -->
    <rect x="680" y="112" width="230" height="170" fill="#fbe0dc" stroke="#c0392b" stroke-width="2"/>
    <text x="690" y="130" fill="#1c1c1c" font-weight="bold">jump 4 chronicle</text>
    <rect x="690" y="140" width="210" height="60" fill="#f4d4ce"/>
    <text x="695" y="155" fill="#1c1c1c" font-size="10">closing entry, a register no</text>
    <text x="695" y="168" fill="#1c1c1c" font-size="10">ordinary jump uses: comments</text>
    <text x="695" y="181" fill="#1c1c1c" font-size="10">on the story repeating itself</text>
    <text x="690" y="220" fill="#1c1c1c" font-weight="bold" font-size="11">this jump crosses the boundary</text>
  </g>

  <line x1="795" y1="282" x2="795" y2="340" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowC)"/>
  <defs>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1c1c1c"/>
    </marker>
  </defs>

  <!-- era chain -->
  <text x="40" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a564c">the campaign's owned ages, in order, with the loop after the last</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="60" y="350" width="170" height="60" fill="#e3dfd3" stroke="#8a8578"/>
    <text x="145" y="384" fill="#1c1c1c">age owned first</text>

    <line x1="230" y1="380" x2="290" y2="380" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowC)"/>

    <rect x="290" y="350" width="170" height="60" fill="#c9d8ee" stroke="#1c1c1c" stroke-width="2"/>
    <text x="375" y="378" fill="#1c1c1c" font-weight="bold">age owned second</text>
    <text x="375" y="396" fill="#1c1c1c" font-size="10" font-weight="bold">rescaled, fresh categories</text>

    <line x1="460" y1="380" x2="520" y2="380" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowC)"/>

    <rect x="520" y="350" width="170" height="60" fill="#e3dfd3" stroke="#8a8578"/>
    <text x="605" y="384" fill="#1c1c1c">age owned third</text>

    <line x1="690" y1="380" x2="750" y2="380" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrowC)"/>

    <rect x="750" y="350" width="150" height="60" fill="#dfe7d6" stroke="#8a8578"/>
    <text x="825" y="378" fill="#1c1c1c">no next pack:</text>
    <text x="825" y="396" fill="#1c1c1c">keeps closing ages</text>
  </g>

  <path d="M 750 420 C 500 470, 300 470, 145 420" fill="none" stroke="#4a78c2" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowC)"/>
  <text x="400" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4a4a44">history loops: the chronicle's sense of "already said" resets with it</text>

  <rect x="24" y="500" width="912" height="26" fill="#e9e6dd" stroke="#8a8578"/>
  <text x="40" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a44">the returning age tells its stories fresh again, now about names already faded to myth</text>
</svg>
