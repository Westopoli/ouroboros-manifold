# claude-swarm project config for Ouroboros Manifold
# See also: docs/northstar/plans/cascades/README.md (layout and landing path)

spec_dir            = "docs/northstar/plans/cascades/"
# set per cascade by its spec commit (docs/northstar/plans/cascades/README.md); this one: lab-stage3
type_contract_path  = "docs/northstar/plans/cascades/lab-stage3/contract.py"
umbrella_test_cmd   = "/home/westopoli/Projects/ouroboros-manifold/.venv/bin/python -m pytest tests/skilllab/arena/test_stage3_umbrella.py -q -p no:cacheprovider"
apex_test_cmd       = "scripts/specfactory/pre_gate.sh"
briefs_dir          = "docs/northstar/plans/cascades/lab-stage3/briefs/"
graphify_cmd        = ""
worktree_link       = []

parent_owned = [
  "csrc/ouroboros_sim.h", "docs/northstar/spec_factory/signatures.toml",
  "docs/bible/**", "docs/northstar/**", "tests/**",
  "scripts/specfactory/**", "Makefile", "autoload/**",
  # lab-stage3: "scenes/**" is not parent-owned here, leaf C owns scenes/proto/fight_replay/fight_replay.gd (restore it after the cascade)
  "tests/csim/data/**", "tests/skilllab/golden_hashes.json",
]

[invariants]
max_impl_lines      = 1500
max_test_assertions = 40
ambiguous_verbs = [
  "decide", "choose", "design", "determine",
  "figure out", "resolve", "as appropriate",
  "use your judgment", "pick", "select an approach",
]

[gates]
extra_spec_gate_cmds = []
