# claude-swarm project config for Ouroboros Manifold
# See also: docs/northstar/plans/cascades/README.md (layout and landing path), pieces row HARNESS-swarm-config

spec_dir            = "docs/northstar/plans/cascades/"
# set per cascade by its records commit (this one: lab-stage4; "scenes/**" is out of parent_owned for leaf B, restored in the landing commit, DEC-client-cascade-parent-owned-2026-11-05)
type_contract_path  = "docs/northstar/plans/cascades/lab-stage4/contract.py"
umbrella_test_cmd   = ".venv/bin/python -m pytest tests/skilllab/arena/test_stage4_umbrella.py -q -p no:cacheprovider"
apex_test_cmd       = "make && godot.real --headless --import --path . && python3 -m pytest tests/qa/test_beta_b1_chain.py tests/method/test_beta_build_sha.py tests/method/test_setup_editor.py -q -p no:cacheprovider"
briefs_dir          = "docs/northstar/plans/cascades/lab-stage4/briefs/"
graphify_cmd        = ""
worktree_link       = []

parent_owned = [
  "csrc/ouroboros_sim.h", "docs/northstar/spec_factory/signatures.toml",
  "docs/bible/**", "docs/northstar/**", "tests/**",
  "scripts/specfactory/**", "Makefile",
  "tests/csim/data/**", "tests/skilllab/golden_hashes.json",
]

[invariants]
max_impl_lines      = 1500
max_test_assertions = 40
ambiguous_verbs = [
  "decide", "choose", "design", "determine",
  "figure out", "resolve", "as appropriate",
  "use your judgment", "pick", "select an approach",
]

[gates]
extra_spec_gate_cmds = []
