# Lane -> owned path globs for the lane_plays gate stage (HARNESS-laneplays).
# A lane's plays under tests/qa/desktop/plays/<L>/ run when the diff touches one of its globs.
[lanes]
A = ["scenes/tactical_c/**"]
B = ["scenes/galaxy/**"]
C = ["scenes/ground3d/**"]
D = ["scenes/space3d/**"]
E = ["scenes/settlement/**"]
F = ["autoload/net/**", "scenes/lobby/**"]

# Shared paths: a diff touching one runs the listed lanes' plays ("*" = every lane with a plays directory).
# autoload/net/** is excepted from autoload/** in lane_plays_check (F only, through its own glob).
[shared]
"tests/qa/desktop/plays/*/_play.py" = ["*"]
"tests/qa/desktop/plays/A/play_support.py" = ["*"]
"tests/qa/desktop/daemon_client.py" = ["*"]
"tests/qa/desktop/conftest.py" = ["*"]
"autoload/**" = ["*"]
"scenes/tactical_c/**" = ["A", "C"]
"scenes/main*/**" = ["*"]
"project.godot" = ["*"]
"pipe/**" = ["*"]
"csrc/**" = ["*"]
